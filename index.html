<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusFlow | Capture & Manage</title>
    <script>
      // Guard against libraries trying to overwrite fetch in read-only environments
      (function() {
        const originalFetch = window.fetch;
        if (originalFetch) {
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(val) { 
                console.warn('Blocked attempt to overwrite window.fetch');
                return originalFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            console.warn('Could not redefine fetch, assigning manually if possible');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
